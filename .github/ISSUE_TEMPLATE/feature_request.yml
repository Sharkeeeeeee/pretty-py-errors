name: Feature request
description: Suggest a new feature, checker, translation or hint
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to read or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: example
    attributes:
      label: Example checker output
      render: text
